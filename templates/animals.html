{% extends 'base.html' %}

{% block content %}

<h2>Животные</h2>

<!-- Форма добавления -->
<form method="POST" action="/animals/add" class="mb-3">
    <input type="text" name="name" placeholder="Имя" required>
    <input type="number" name="age" placeholder="Возраст" required>
    <button type="submit" class="btn btn-primary">Добавить</button>
</form>

<!-- Таблица -->
<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Возраст</th>
            <th>Действия</th>
        </tr>
    </thead>

    <tbody>
        {% for animal in animals %}
        <tr>
            <td>{{ animal[0] }}</td>
            <td>{{ animal[1] }}</td>
            <td>{{ animal[2] }}</td>
            <td>
                <a href="/animals/delete/{{ animal[0] }}" class="btn btn-danger btn-sm">
                    Удалить
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
