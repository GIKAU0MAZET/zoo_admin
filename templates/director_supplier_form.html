{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">
                    {% if supplier %}Редактировать поставщика{% else %}Новый поставщик{% endif %}
                </h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Наименование *</label>
                        <input type="text" name="name" class="form-control" required
                               value="{{ supplier[1] if supplier else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Юридический адрес</label>
                        <input type="text" name="legal_address" class="form-control"
                               value="{{ supplier[2] if supplier else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Фактический адрес</label>
                        <input type="text" name="actual_address" class="form-control"
                               value="{{ supplier[3] if supplier else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Телефон</label>
                        <input type="text" name="phone" class="form-control"
                               value="{{ supplier[4] if supplier else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control"
                               value="{{ supplier[5] if supplier else '' }}">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                        <a href="/director/suppliers" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
