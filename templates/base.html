<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Zoo Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="d-flex">

        <div class="sidebar">

            <h3 class="text-center mt-3">
                🦁 {{ zoo_name }}
            </h3>

            <hr>

            {% if session.get('role') == 'Кассир' %}

            <a href="/tickets">Продажа билетов</a>

            {% elif session.get('role') == 'Смотритель' %}
            <a href="/watcher/animals">Животные</a>
            <a href="/feeding">Кормление</a>

            {% else %}

            <a href="/">Главная</a>
            <a href="/animals">Животные</a>
            <a href="/species">Виды</a>
            <a href="/cages">Вольеры</a>
            <a href="/purchase-requests">Заявки на закупку</a>
            <a href="#">Заявки на лечение</a>

            {% endif %}

            <a href="/logout">🚪 Выйти</a>

        </div>

        <div class="content">

            {% block content %}
            {% endblock %}

        </div>

    </div>

</body>

</html>
