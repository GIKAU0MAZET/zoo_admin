{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">
                    {% if employee %}Редактировать сотрудника{% else %}Новый сотрудник{% endif %}
                </h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Фамилия *</label>
                        <input type="text" name="last_name" class="form-control" required
                               value="{{ employee[1] if employee else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Имя *</label>
                        <input type="text" name="first_name" class="form-control" required
                               value="{{ employee[2] if employee else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Отчество</label>
                        <input type="text" name="middle_name" class="form-control"
                               value="{{ employee[3] if employee else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Должность *</label>
                        <select name="position" class="form-select" required>
                            {% set positions = ['Администратор', 'Директор', 'Кассир', 'Смотритель', 'Ветеринар'] %}
                            {% for p in positions %}
                            <option value="{{ p }}" {% if employee and employee[4] == p %}selected{% endif %}>
                                {{ p }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Телефон</label>
                        <input type="text" name="phone" class="form-control"
                               value="{{ employee[5] if employee else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Дата приёма *</label>
                        <input type="date" name="hire_date" class="form-control" required
                               value="{{ employee[6].strftime('%Y-%m-%d') if employee and employee[6] else '' }}">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                        <a href="/director/employees" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
