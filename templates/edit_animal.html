{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Редактировать животное</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="/animals/update/{{ animal[0] }}">

                    <div class="mb-3">
                        <label class="form-label">Кличка *</label>
                        <input type="text" name="name" class="form-control" required
                               value="{{ animal[1] }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Дата рождения *</label>
                        <input type="date" name="birth_date" class="form-control" required
                               value="{{ animal[2].strftime('%Y-%m-%d') if animal[2] else '' }}">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                        <a href="/animals" class="btn btn-outline-secondary">Отмена</a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
