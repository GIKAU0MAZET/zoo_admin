{% extends 'base.html' %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Поставщики</h2>
    <a href="/director/suppliers/add" class="btn btn-success">+ Добавить поставщика</a>
</div>

<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Наименование</th>
            <th>Юр. адрес</th>
            <th>Телефон</th>
            <th>Email</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for s in suppliers %}
        <tr>
            <td>{{ s[0] }}</td>
            <td>{{ s[1] }}</td>
            <td>{{ s[2] or '—' }}</td>
            <td>{{ s[4] or '—' }}</td>
            <td>{{ s[5] or '—' }}</td>
            <td>
                <a href="/director/suppliers/edit/{{ s[0] }}" class="btn btn-sm btn-warning">
                    Редактировать
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
