{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Редактирование заявки №{{ request_data[0] }}</h5>
            </div>
            <div class="card-body">
                <form action="/treatment-requests/update/{{ request_data[0] }}" method="post">

                    <div class="mb-3">
                        <label class="form-label">Животное *</label>
                        <select name="animal_id" class="form-select" required>
                            {% for animal in animals %}
                            <option value="{{ animal[0] }}"
                                {% if animal[0] == request_data[2] %}selected{% endif %}>
                                {{ animal[1] }} — {{ animal[2] }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Ветеринар *</label>
                        <select name="veterinarian_id" class="form-select" required>
                            {% for vet in veterinarians %}
                            <option value="{{ vet[0] }}"
                                {% if vet[0] == request_data[3] %}selected{% endif %}>
                                {{ vet[1] }} {{ vet[2] }} {{ vet[3] }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Тип лечения *</label>
                        <select name="title" class="form-select" required>
                            {% for t in ['Осмотр', 'Повторный осмотр', 'Профилактика', 'Контроль состояния', 'Лечение', 'Вакцинация'] %}
                            <option value="{{ t }}"
                                {% if request_data[4] == t %}selected{% endif %}>
                                {{ t }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Статус</label>
                        <select name="status" class="form-select">
                            {% for s in ['Создана', 'На рассмотрении', 'Одобрена', 'Выполняется', 'Завершена'] %}
                            <option value="{{ s }}"
                                {% if request_data[5] == s %}selected{% endif %}>
                                {{ s }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                        <a href="/treatment-requests" class="btn btn-outline-secondary">Отмена</a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
