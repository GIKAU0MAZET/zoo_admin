<!DOCTYPE html>
<html>
<head>
    <title>Авторизация</title>
</head>
<body>

<h2>Вход в систему</h2>

<form method="POST">

    <input
        type="text"
        name="login"
        placeholder="Логин"
        required
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Пароль"
        required
    >

    <br><br>

    <button type="submit">
        Войти
    </button>

</form>

{% if error %}
<p style="color:red">
    {{ error }}
</p>
{% endif %}

</body>
</html>
