{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Редактировать вольер №{{ cage[1] }}</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="/cages/edit/{{ cage[0] }}">
                    <div class="mb-3">
                        <label class="form-label">Номер *</label>
                        <input type="text" name="number" class="form-control" required
                               value="{{ cage[1] }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Тип</label>
                        <input type="text" name="cage_type" class="form-control"
                               value="{{ cage[2] or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Площадь (м²)</label>
                        <input type="number" step="0.01" name="area" class="form-control"
                               value="{{ cage[3] or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Климат</label>
                        <input type="text" name="climate" class="form-control"
                               value="{{ cage[4] or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Вместимость</label>
                        <input type="number" name="capacity" class="form-control"
                               value="{{ cage[5] or '' }}">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                        <a href="/cages" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
