{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">
    Панель администратора
</h1>

<div class="row">

    <div class="col-md-3">
        <div class="card stat-card">
            <div class="card-body">
                <h5>Животные</h5>
                <h2>{{ animals_count }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card stat-card">
            <div class="card-body">
                <h5>Виды</h5>
                <h2>{{ species_count }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card stat-card">
            <div class="card-body">
                <h5>Вольеры</h5>
                <h2>{{ cages_count }}</h2>
            </div>
        </div>
    </div>

</div>

{% endblock %}
