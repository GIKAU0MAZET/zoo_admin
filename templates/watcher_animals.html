{% extends 'base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Животные</h2>
</div>

<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Вид</th>
            <th>Дата рождения</th>
        </tr>
    </thead>
    <tbody>
        {% for a in animals %}
        <tr>
            <td>{{ a.id }}</td>
            <td>{{ a.name }}</td>
            <td>{{ a.species }}</td>
            <td>{{ a.birth_date }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
