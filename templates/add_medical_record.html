{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Провести осмотр</h5>
            </div>
            <div class="card-body">

                {# Инфо о заявке — только чтение #}
                <div class="mb-3 p-3 bg-light rounded">
                    <div><strong>Заявка №:</strong> {{ treatment_request[0] }}</div>
                    <div><strong>Животное:</strong> {{ treatment_request[3] }}</div>
                    <div><strong>Тип:</strong> {{ treatment_request[4] }}</div>
                </div>

                <form action="/medical-records/add/{{ treatment_request[0] }}" method="post">

                    <div class="mb-3">
                        <label class="form-label">Название осмотра <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control"
                               value="{{ treatment_request[4] }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Дата осмотра <span class="text-danger">*</span></label>
                        <input type="date" name="date" class="form-control" required
                               value="{{ today }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Состояние животного <span class="text-danger">*</span></label>
                        <select name="condition" class="form-select" required>
                            <option value="">— выберите —</option>
                            <option value="Здоров">Здоров</option>
                            <option value="Удовлетворительное">Удовлетворительное</option>
                            <option value="Требует наблюдения">Требует наблюдения</option>
                            <option value="Болен">Болен</option>
                            <option value="На лечении">На лечении</option>
                            <option value="Выздоровел">Выздоровел</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            Сохранить запись
                        </button>
                        <a href="/medical-records" class="btn btn-outline-secondary">
                            Отмена
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
