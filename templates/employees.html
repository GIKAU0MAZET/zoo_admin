{% extends 'base.html' %}

{% block content %}

<h2>Сотрудники</h2>

<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Имя</th>
        </tr>
    </thead>

    <tbody>
        {% for e in employees %}
        <tr>
            <td>{{ e[0] }}</td>
            <td>{{ e[1] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
