{% extends 'base.html' %}
{% block content %}

<h2 class="mb-3">Заявки на закупку</h2>

<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Дата</th>
            <th>Сотрудник</th>
            <th>Исполнитель</th>
            <th>Статус</th>
        </tr>
    </thead>
    <tbody>
        {% for r in requests %}
        <tr>
            <td>{{ r[0] }}</td>
            <td>{{ r[1] }}</td>
            <td>{{ r[2] }}</td>
            <td>{{ r[3] }}</td>
            <td>{{ r[4] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
